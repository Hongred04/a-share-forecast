<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090b">
<title>A股预判</title>
<!-- 主题必须在样式解析前写死，否则刷新时会先闪一下深色 -->
<script>
(function(){try{
  var t=localStorage.getItem('theme');
  if(!t) t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);
}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">

  <div class="nav">
    <div class="logo">A股预判</div>
    <div class="grow"></div>
    <span class="chip" id="phasechip"><span id="dot" class="dot"></span><span id="phase">—</span></span>
    <span class="chip" id="meta">—</span>
    <div class="srcwrap">
      <button class="btn" id="src" aria-haspopup="true" aria-expanded="false"
              title="数据源状态">数据源</button>
      <div id="srcpanel" class="srcpanel hidden"></div>
    </div>
    <button class="btn icon" id="theme" title="切换亮/暗" aria-label="切换主题">
      <svg class="i-sun" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linejoin="round"><path d="M20 13.5A8 8 0 0 1 10.5 4a8 8 0 1 0 9.5 9.5z"/></svg>
    </button>
    <button class="btn" id="auto" title="自动刷新（点击切换间隔）">自动 关</button>
    <button class="btn" id="refresh">刷新</button>
    <button class="btn primary" id="rebuild">重算</button>
  </div>
  <div class="prog" id="prog"></div>

  <div id="app"><div class="empty"><div class="spin"></div><span id="loading">正在拉取行情并计算…</span></div></div>

  <div class="foot">概率估计，不构成投资建议</div>
</div>
<script src="/static/app.js" defer></script>
</body>
</html>
